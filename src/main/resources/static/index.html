<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snip — URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ── CSS Custom Properties ─────────────────────────────────────────── */
        :root {
            --bg:           #0c0c0f;
            --surface:      #141418;
            --surface-2:    #1c1c22;
            --border:       #2a2a35;
            --border-focus: #5b5bf6;
            --accent:       #5b5bf6;
            --accent-glow:  rgba(91, 91, 246, 0.35);
            --accent-2:     #a78bfa;
            --text:         #f0f0f5;
            --text-muted:   #7c7c95;
            --text-faint:   #3f3f52;
            --success:      #34d399;
            --success-bg:   rgba(52, 211, 153, 0.1);
            --error:        #f87171;
            --error-bg:     rgba(248, 113, 113, 0.1);
            --radius:       14px;
            --radius-sm:    8px;
            --transition:   0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── Reset & Base ──────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 16px; }

        body {
            font-family: 'Syne', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Background Decoration ─────────────────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(91,91,246,0.12) 0%, transparent 60%),
                    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(167,139,250,0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Subtle grid pattern */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                    linear-gradient(var(--text-faint) 1px, transparent 1px),
                    linear-gradient(90deg, var(--text-faint) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Layout ────────────────────────────────────────────────────────── */
        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        /* ── Header ────────────────────────────────────────────────────────── */
        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        .logo-icon svg { width: 22px; height: 22px; }

        h1 {
            font-size: clamp(2rem, 6vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--text) 40%, var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* ── Main Card ─────────────────────────────────────────────────────── */
        .card {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow:
                    0 0 0 1px rgba(255,255,255,0.03) inset,
                    0 24px 48px rgba(0,0,0,0.5);
        }

        /* ── Form ──────────────────────────────────────────────────────────── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .input-row {
            display: flex;
            gap: 0.625rem;
        }

        input[type="url"] {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            color: var(--text);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            min-width: 0;
        }

        input[type="url"]::placeholder { color: var(--text-faint); }

        input[type="url"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ── Buttons ───────────────────────────────────────────────────────── */
        .btn-shorten {
            background: linear-gradient(135deg, var(--accent), #7c7cf5);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.75rem 1.375rem;
            font-family: 'Syne', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            white-space: nowrap;
            transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
            box-shadow: 0 4px 16px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }

        .btn-shorten:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-shorten:active:not(:disabled) { transform: translateY(0); }

        .btn-shorten:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Shimmer on loading */
        .btn-shorten.loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to   { transform: translateX(100%); }
        }

        /* ── Result Area ───────────────────────────────────────────────────── */
        .result {
            margin-top: 1.25rem;
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            animation: fadeSlideUp 0.3s ease both;
        }

        .result.visible { display: flex; }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Success result box */
        .result-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--success-bg);
            border: 1px solid rgba(52, 211, 153, 0.25);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
        }

        .result-url {
            flex: 1;
            font-family: 'DM Mono', monospace;
            font-size: 0.875rem;
            color: var(--success);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-decoration: none;
        }

        .result-url:hover { text-decoration: underline; }

        .btn-copy {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 6px;
            color: var(--success);
            cursor: pointer;
            padding: 0.35rem 0.65rem;
            font-family: 'Syne', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: all var(--transition);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-copy:hover {
            background: rgba(52, 211, 153, 0.25);
            transform: scale(1.03);
        }

        .btn-copy.copied {
            background: rgba(52, 211, 153, 0.3);
            border-color: var(--success);
        }

        /* Error box */
        .error-box {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            background: var(--error-bg);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            color: var(--error);
            font-size: 0.875rem;
        }

        /* ── Divider ───────────────────────────────────────────────────────── */
        .divider {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 1.5rem 0;
        }

        /* ── Stats strip ───────────────────────────────────────────────────── */
        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .stat {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        /* ── Footer ────────────────────────────────────────────────────────── */
        footer {
            font-size: 0.75rem;
            color: var(--text-faint);
            text-align: center;
            line-height: 1.6;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }

        footer a:hover { color: var(--accent-2); }

        /* ── Responsive ────────────────────────────────────────────────────── */
        @media (max-width: 480px) {
            .card { padding: 1.5rem 1.25rem; }
            .input-row { flex-direction: column; }
            .btn-shorten { width: 100%; }
            .stats { gap: 1.25rem; }
        }
    </style>
</head>

<body>
<div class="page">

    <!-- Header -->
    <header>
        <div class="logo">
            <div class="logo-icon">
                <!-- Scissors / link icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
                </svg>
            </div>
            <h1>Snip</h1>
        </div>
        <p class="tagline">Paste long. Get short. Share fast.</p>
    </header>

    <!-- Main Card -->
    <div class="card">
        <div class="form-group">
            <label for="urlInput">Long URL</label>
            <div class="input-row">
                <input
                        type="url"
                        id="urlInput"
                        placeholder="https://your-very-long-url.com/goes/here"
                        autocomplete="off"
                        spellcheck="false"
                />
                <button class="btn-shorten" id="shortenBtn" onclick="handleShorten()">
                    Snip it →
                </button>
            </div>
        </div>

        <!-- Result / Error area -->
        <div class="result" id="resultArea"></div>

        <div class="divider"></div>

        <div class="stats">
            <div class="stat">
                <span class="stat-value">Base62</span>
                <span class="stat-label">Encoding</span>
            </div>
            <div class="stat">
                <span class="stat-value">6 chars</span>
                <span class="stat-label">Short Code</span>
            </div>
            <div class="stat">
                <span class="stat-value">302</span>
                <span class="stat-label">Redirect</span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Built with Spring Boot 3 + Java 21 + MySQL<br/>
        <a href="https://github.com" target="_blank" rel="noopener">View Source on GitHub</a>
    </footer>

</div>

<script>
    // ── CONFIG ──────────────────────────────────────────────────────────────
    // Change this to your deployed backend URL when hosting separately.
    // Example: "https://api.yourdomain.com"  or  "http://your-server-ip:8080"
    const API_BASE_URL = "http://localhost:8080";

    // ── DOM refs ─────────────────────────────────────────────────────────
    const input     = document.getElementById("urlInput");
    const btn       = document.getElementById("shortenBtn");
    const resultArea = document.getElementById("resultArea");

    // ── Allow pressing Enter to trigger shortening ────────────────────────
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleShorten();
    });

    // ── Main handler ──────────────────────────────────────────────────────
    async function handleShorten() {
        const rawUrl = input.value.trim();

        // Client-side guard — backend also validates but this gives instant feedback
        if (!rawUrl) {
            showError("Please enter a URL first.");
            return;
        }

        setLoading(true);
        clearResult();

        try {
            const response = await fetch(`${API_BASE_URL}/api/shorten`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: rawUrl }),
            });

            const data = await response.json();

            if (!response.ok) {
                // Backend returned 4xx/5xx — show the error message from JSON
                showError(data.error || "Something went wrong. Please try again.");
                return;
            }

            showSuccess(data.shortUrl);

        } catch (err) {
            // Network error (e.g. backend not running)
            console.error("Network error:", err);
            showError(
                "Could not reach the server. Make sure the backend is running at: " + API_BASE_URL
            );
        } finally {
            setLoading(false);
        }
    }

    // ── UI helpers ────────────────────────────────────────────────────────

    function setLoading(loading) {
        btn.disabled = loading;
        btn.textContent = loading ? "Snipping…" : "Snip it →";
        btn.classList.toggle("loading", loading);
    }

    function clearResult() {
        resultArea.innerHTML = "";
        resultArea.classList.remove("visible");
    }

    function showSuccess(shortUrl) {
        resultArea.innerHTML = `
        <div class="result-box">
          <a class="result-url" href="${shortUrl}" target="_blank" rel="noopener">${shortUrl}</a>
          <button class="btn-copy" id="copyBtn" onclick="copyToClipboard('${shortUrl}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy
          </button>
        </div>
      `;
        resultArea.classList.add("visible");
    }

    function showError(message) {
        resultArea.innerHTML = `
        <div class="error-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          ${escapeHtml(message)}
        </div>
      `;
        resultArea.classList.add("visible");
    }

    async function copyToClipboard(text) {
        const copyBtn = document.getElementById("copyBtn");

        try {
            await navigator.clipboard.writeText(text);

            // Animate success feedback
            copyBtn.classList.add("copied");
            copyBtn.innerHTML = `
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Copied!
        `;

            // Reset after 2s
            setTimeout(() => {
                copyBtn.classList.remove("copied");
                copyBtn.innerHTML = `
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy
          `;
            }, 2000);

        } catch (err) {
            // Fallback for older browsers
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            copyBtn.textContent = "Copied!";
            setTimeout(() => { copyBtn.textContent = "Copy"; }, 2000);
        }
    }

    // Prevent XSS when inserting user-supplied strings into innerHTML
    function escapeHtml(str) {
        const d = document.createElement("div");
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }
</script>
</body>
</html>
